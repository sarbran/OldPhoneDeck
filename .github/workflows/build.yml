name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build -c release
      - name: Collect binary and resources
        run: |
          mkdir dist
          cp .build/release/oldphonedeck dist/
          cp -R .build/release/*.bundle dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: oldphonedeck-macos
          path: dist
